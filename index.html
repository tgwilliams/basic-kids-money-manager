<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Money Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <h1>My Money Manager</h1>
    <button id="reset-btn" class="reset-btn" type="button">Reset</button>
  </header>

  <main>
    <section class="card chart-card" aria-labelledby="chart-title">
      <h2 id="chart-title">Where my money went</h2>
      <p class="total">Total spent: <strong id="total-spent">$0.00</strong></p>
      <div class="chart-wrap">
        <svg id="pie" viewBox="0 0 200 200" role="img" aria-label="Pie chart of spending by category"></svg>
        <div id="tooltip" class="tooltip" hidden></div>
        <p id="chart-empty" class="chart-empty">No spending yet.<br>Add your first one below!</p>
      </div>
      <ul id="legend" class="legend"></ul>
    </section>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Add spending</h2>
      <form id="spend-form" novalidate>
        <label>
          How much did you spend?
          <span class="money-input">
            <span aria-hidden="true">$</span>
            <input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required>
          </span>
        </label>
        <label>
          When?
          <input id="date" name="date" type="date" required>
        </label>
        <label>
          What is the category?
          <select id="category" name="category" required></select>
        </label>
        <label>
          Where did you spend it?
          <input id="place" name="place" type="text" maxlength="60" placeholder="e.g. Corner store" required>
        </label>
        <p id="form-error" class="form-error" role="alert"></p>
        <button type="submit" class="add-btn">Add it!</button>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <h2 id="list-title">All my spending</h2>
      <p id="list-empty" class="list-empty">Nothing here yet.</p>
      <ul id="tx-list" class="tx-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
